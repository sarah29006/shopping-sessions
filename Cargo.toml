[package]
name = "shopping"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "60.2.0"
arrow-schema = "60.2.0"
hashbrown = "0.17.2"
memchr = "2.8.3"
memmap2 = "0.9.12"
parquet = { version = "60.2.0", default-features = false, features = ["arrow"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
